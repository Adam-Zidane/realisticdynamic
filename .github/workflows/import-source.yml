
name: Import Realistic Dynamic 1.3.0 All Activities

on:
  workflow_dispatch:
  push:
    paths:
      - RealisticDynamic-1.3.0-All-Activities-source.zip

permissions:
  contents: write

concurrency:
  group: realisticdynamic-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip rsync

      - name: Extract source
        run: |
          set -euo pipefail

          ARCHIVE="RealisticDynamic-1.3.0-All-Activities-source.zip"
          SOURCE="/tmp/rd-import/realisticdynamic-main"

          test -f "$ARCHIVE"

          rm -rf /tmp/rd-import
          mkdir -p /tmp/rd-import

          unzip -oq "$ARCHIVE" -d /tmp/rd-import

          test -f "$SOURCE/RealisticDynamic/Tweak.m"
          test -f "$SOURCE/RealisticDynamic/Makefile"
          test -f "$SOURCE/RealisticDynamic/control"
          test -f "$SOURCE/.github/workflows/build.yml"

          echo "Source archive verified."

      - name: Import all project files
        run: |
          set -euo pipefail

          SOURCE="/tmp/rd-import/realisticdynamic-main"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "$SOURCE/" ./

          mkdir -p .github/workflows

          cp "$SOURCE/.github/workflows/build.yml" \
            .github/workflows/build.yml

          rm -f RealisticDynamic-1.3.0-All-Activities-source.zip

      - name: Verify source
        run: |
          set -euo pipefail

          test -f RealisticDynamic/Tweak.m
          test -f RealisticDynamic/Makefile
          test -f RealisticDynamic/control
          test -f RealisticDynamic/RootListController.m

          test -f RealisticDynamic/layout/Library/PreferenceBundles/RealisticDynamicPrefs.bundle/Root.plist

          test -f .github/workflows/build.yml
          test -f .github/workflows/import-source.yml

          echo "All source files verified."

      - name: Commit changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Release Realistic Dynamic 1.3.0 All Activities"

      - name: Push to main
        run: |
          set -euo pipefail

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Import completed
        run: |
          echo "REALISTIC DYNAMIC 1.3.0 IMPORT COMPLETE"
