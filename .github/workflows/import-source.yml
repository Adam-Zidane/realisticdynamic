name: Import Realistic Dynamic source

on:
  workflow_dispatch:
  push:
    paths:
      - RealisticDynamic-1.0.0-source.zip

permissions:
  contents: write

concurrency:
  group: realisticdynamic-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source archive
        run: |
          set -e

          test -f RealisticDynamic-1.0.0-source.zip

          rm -rf /tmp/RealisticDynamic
          mkdir -p /tmp/RealisticDynamic

          unzip -oq RealisticDynamic-1.0.0-source.zip -d /tmp/RealisticDynamic

          test -f /tmp/RealisticDynamic/RealisticDynamic/Tweak.xm

      - name: Import Realistic Dynamic source
        run: |
          set -e

          rsync -a \
            --exclude='.github/' \
            /tmp/RealisticDynamic/RealisticDynamic/ ./

          rm -f RealisticDynamic-1.0.0-source.zip

      - name: Commit and push imported source
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Import Realistic Dynamic source"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
