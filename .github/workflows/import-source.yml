
name: Import Realistic Dynamic Repository

on:
  workflow_dispatch:
  push:
    paths:
      - 'RealisticDynamic-1.3.0-All-Activities-source.zip'
      - 'RealisticDynamic-1.3.1-FULL-IMPORT-FIX-source.zip'

permissions:
  contents: write

concurrency:
  group: realisticdynamic-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip rsync

      - name: Find and extract source archive
        run: |
          set -euo pipefail

          echo "Files in repository root:"
          ls -lah

          ARCHIVE=""

          for candidate in \
            "RealisticDynamic-1.3.1-FULL-IMPORT-FIX-source.zip" \
            "RealisticDynamic-1.3.0-All-Activities-source.zip"
          do
            if [ -f "$candidate" ]; then
              ARCHIVE="$candidate"
              break
            fi
          done

          if [ -z "$ARCHIVE" ]; then
            echo "::error::Source ZIP not found in repository root."
            exit 1
          fi

          echo "Using archive: $ARCHIVE"

          rm -rf /tmp/rd-import
          mkdir -p /tmp/rd-import

          unzip -oq "$ARCHIVE" -d /tmp/rd-import

          TWEAK="$(find /tmp/rd-import -type f \
            -path '*/RealisticDynamic/Tweak.m' \
            -print -quit)"

          if [ -z "$TWEAK" ]; then
            echo "::error::RealisticDynamic/Tweak.m not found in ZIP."
            find /tmp/rd-import -maxdepth 4 -type f
            exit 1
          fi

          SOURCE="$(dirname "$(dirname "$TWEAK")")"

          test -f "$SOURCE/RealisticDynamic/Makefile"
          test -f "$SOURCE/RealisticDynamic/control"
          test -f "$SOURCE/.github/workflows/build.yml"

          echo "Source archive verified."
          echo "Source directory: $SOURCE"

          echo "$SOURCE" > /tmp/rd-source-path
          echo "$ARCHIVE" > /tmp/rd-archive-name

      - name: Import project files
        run: |
          set -euo pipefail

          SOURCE="$(cat /tmp/rd-source-path)"
          ARCHIVE="$(cat /tmp/rd-archive-name)"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "$SOURCE/" ./

          mkdir -p .github/workflows

          cp \
            "$SOURCE/.github/workflows/build.yml" \
            .github/workflows/build.yml

          rm -f "$ARCHIVE"

      - name: Verify imported project
        run: |
          set -euo pipefail

          test -f RealisticDynamic/Tweak.m
          test -f RealisticDynamic/Makefile
          test -f RealisticDynamic/control
          test -f RealisticDynamic/RootListController.m
          test -f .github/workflows/build.yml
          test -f .github/workflows/import-source.yml

          echo "Project verification successful."

      - name: Commit imported source
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Import Realistic Dynamic 1.3.1 source"

      - name: Push changes to main
        run: |
          set -euo pipefail

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Import completed
        run: |
          echo "REALISTIC DYNAMIC IMPORT SUCCESS"
          echo "Source: RealisticDynamic/"
          echo "Build workflow: Updated"
          echo "Branch: main"
