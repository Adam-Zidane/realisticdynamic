
name: Import Realistic Dynamic source

on:
  workflow_dispatch:
  push:
    paths:
      - RealisticDynamic-ZidaneAdam-1.1.0-source.zip

permissions:
  contents: write

concurrency:
  group: realisticdynamic-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source archive
        run: |
          set -e

          test -f RealisticDynamic-ZidaneAdam-1.1.0-source.zip

          rm -rf /tmp/rd-source
          mkdir -p /tmp/rd-source

          unzip -oq RealisticDynamic-ZidaneAdam-1.1.0-source.zip -d /tmp/rd-source

          test -f /tmp/rd-source/Tweak.m
          test -f /tmp/rd-source/Makefile

      - name: Import project files
        run: |
          set -e

          rsync -a \
            --exclude='.github/' \
            /tmp/rd-source/ ./

          rm -f RealisticDynamic-ZidaneAdam-1.1.0-source.zip

      - name: Commit and push imported source
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Import Realistic Dynamic 1.1.0 source"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
