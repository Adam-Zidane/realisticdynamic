name: Import Realistic Dynamic source

on:
  push:
    paths:
      - RealisticDynamic-1.0.0-source.zip

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project files
        run: |
          mkdir -p /tmp/rd-source
          unzip -oq RealisticDynamic-1.0.0-source.zip -d /tmp/rd-source
          rsync -a --exclude='.github/' /tmp/rd-source/RealisticDynamic/ ./
          rm -f RealisticDynamic-1.0.0-source.zip

            - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Import Realistic Dynamic source"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add -A
          git commit -m "Import Realistic Dynamic source" || exit 0
          git push
